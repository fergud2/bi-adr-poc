name: ADR Report

on:
  pull_request:
    paths:
      - "docs/adr/**"
      - "scripts/generate_adr_report.py"
      - ".github/workflows/adr-report.yml"
  push:
    branches:
      - main
    paths:
      - "docs/adr/**"
      - "scripts/generate_adr_report.py"
      - ".github/workflows/adr-report.yml"

jobs:
  adr-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate ADRs
        run: |
          python scripts/generate_adr_report.py \
            --adr-dir docs/adr \
            --validate-only

      - name: Generate ADR report
        run: |
          python scripts/generate_adr_report.py \
            --adr-dir docs/adr \
            --application internal-bi-platform \
            --title "Internal BI Platform ADR Report" \
            --output docs/reports/internal-bi-platform-adr-report.md \
            --include-git

      - name: Upload ADR report artifact
        uses: actions/upload-artifact@v4
        with:
          name: internal-bi-platform-adr-report
          path: docs/reports/internal-bi-platform-adr-report.md
